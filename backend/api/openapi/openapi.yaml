  /v1/billing/plans:
    get:
      operationId: getv1billingplans
      summary: List sellable plans
      description: Returns every plan in the catalog. Plans are global, so this list
        is identical for all organizations. Requires the billing.read permission.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanListResponse'
        '403':
          description: The caller's role does not grant billing.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/billing/subscription:
    get:
      operationId: getv1billingsubscription
      summary: Get the organization's current plan and billing cycle
      description: Returns the organization's stored subscription plus the server's
        billing mode. An organization with no subscription is reported as not found
        rather than as an empty object. Requires the billing.read permission.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '403':
          description: The caller's role does not grant billing.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The organization has no subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: updateBillingSubscription
      summary: Switch the organization to another plan
      description: Sets the organization's plan directly, without a payment. Requires
        the billing.manage permission or the admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingUpdateSubscriptionRequest'
      responses:
        '200':
          description: The updated subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          description: Malformed body or empty plan_code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller may not manage billing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No plan has this code, or the organization has no subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Billing is disabled on this server (flat error body, code billing_disabled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorResponse'
    delete:
      operationId: cancelBillingSubscription
      summary: Cancel the subscription at period end
      description: Marks the active subscription to cancel at the end of the current
        period and returns it. Requires the billing.manage permission or the admin
        role.
      responses:
        '200':
          description: The subscription after cancellation was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '403':
          description: The caller may not manage billing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The organization has no subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Billing is disabled on this server (flat error body, code billing_disabled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorResponse'
  /v1/billing/usage:
    get:
      operationId: getv1billingusage
      summary: Get recorded cost and request totals for a window
      description: Returns the same aggregated usage summary as /v1/usage/summary,
        scoped to the caller's organization and accepting the same filters. All values
        are measured from recorded requests. Requires the billing.read permission.
      parameters:
      - name: from
        in: query
        required: false
        description: Inclusive RFC3339 start. Defaults to 30 days ago.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: Exclusive RFC3339 end. Defaults to now.
        schema:
          type: string
          format: date-time
      - name: project_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: user_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: service_account_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: team_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: provider
        in: query
        required: false
        schema:
          type: string
      - name: model
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - succeeded
          - failed
          - cancelled
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingUsageSummary'
        '400':
          description: A time is not RFC3339, from is after to, an id is not a UUID,
            or status is not one of the allowed values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant billing.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/billing/invoices:
    get:
      operationId: getv1billinginvoices
      summary: List the organization's invoices
      description: Returns the organization's invoices newest issued first, each with
        its itemisation lines. Requires the billing.read permission.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListResponse'
        '403':
          description: The caller's role does not grant billing.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/billing/checkout:
    post:
      operationId: createBillingCheckout
      summary: Start a payment checkout session
      description: Creates a checkout session with Stripe or Razorpay for a plan and
        stores a server-side checkout record with the authoritative price. Requires
        the billing.manage permission or the admin role. An unknown provider is
        reported as an internal error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingCheckoutRequest'
      responses:
        '200':
          description: The provider checkout session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCheckoutSession'
        '400':
          description: Malformed body, empty plan_code (ErrorEnvelope), or missing/invalid
            provider credentials (flat body, code missing_credentials or invalid_credentials).
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/BillingErrorResponse'
        '403':
          description: The caller may not manage billing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No plan has this code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Billing is disabled on this server (code billing_disabled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorResponse'
  /v1/billing/verify-payment:
    post:
      operationId: verifyBillingPayment
      summary: Verify a client-side payment callback
      description: Verifies the provider's payment signature against the stored checkout
        for this organization and applies the paid plan. Refused in simulation mode.
        Requires the billing.manage permission or the admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingVerifyPaymentRequest'
      responses:
        '200':
          description: The subscription after the payment was applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          description: Malformed body or no provider/signature (ErrorEnvelope), or a
            flat error with code simulation_mode, invalid_signature, missing_credentials
            or invalid_credentials.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/BillingErrorResponse'
        '403':
          description: The caller may not manage billing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No checkout for this order in the organization (flat body, code
            checkout_not_found), or no subscription afterwards (ErrorEnvelope).
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorEnvelope'
                - $ref: '#/components/schemas/BillingErrorResponse'
        '503':
          description: Billing is disabled on this server (code billing_disabled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorResponse'
  /v1/billing/webhooks/stripe:
    post:
      operationId: handleStripeWebhook
      summary: Receive a Stripe webhook
      description: Unauthenticated. The raw request body is verified against the
        Stripe-Signature header before it is parsed, so it must be forwarded byte
        for byte. Events already ingested are acknowledged without reprocessing.
      parameters:
      - name: Stripe-Signature
        in: header
        required: false
        description: Stripe's signature header for the raw body. Without a valid one
          the event is rejected.
        schema:
          type: string
      requestBody:
        required: true
        description: The Stripe event exactly as Stripe sent it.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: The event was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingWebhookAck'
        '400':
          description: Invalid signature or missing webhook credentials (flat JSON body),
            or any other processing failure (text/plain error message).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorResponse'
            text/plain:
              schema:
                type: string
        '503':
          description: Billing is disabled on this server (code billing_disabled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorResponse'
  /v1/billing/webhooks/razorpay:
    post:
      operationId: handleRazorpayWebhook
      summary: Receive a Razorpay webhook
      description: Unauthenticated. The raw request body is verified against the
        X-Razorpay-Signature header before it is parsed, so it must be forwarded
        byte for byte. Events already ingested are acknowledged without reprocessing.
      parameters:
      - name: X-Razorpay-Signature
        in: header
        required: false
        description: Razorpay's HMAC signature of the raw body. Without a valid one
          the event is rejected.
        schema:
          type: string
      requestBody:
        required: true
        description: The Razorpay event exactly as Razorpay sent it.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: The event was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingWebhookAck'
        '400':
          description: Invalid signature or missing webhook credentials (flat JSON body),
            or any other processing failure (text/plain error message).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorResponse'
            text/plain:
              schema:
                type: string
        '503':
          description: Billing is disabled on this server (code billing_disabled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorResponse'
  /v1/pricing:
    get:
      tags:
      - pricing
      operationId: listPricingModels
      summary: List all pricing models for the organization
      description: Returns every configured pricing model alongside its latest version.
        Note the list key is data, not items. Requires billing.read or providers.read.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingModelListResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags:
      - pricing
      operationId: createPricingModel
      summary: Create or upsert a pricing model
      description: Upserts by model_slug; returns 201 for both a new and an existing
        model. provider_kind is lowercased and currency uppercased. display_name
        defaults to the slug. Requires billing.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePricingModelRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingModel'
        '400':
          description: Malformed body, empty model_slug, unknown provider_kind (invalid_provider_kind)
            or a currency that is not three letters (invalid_currency).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/pricing/{idOrSlug}:
    get:
      tags:
      - pricing
      operationId: getPricingModel
      summary: Get pricing model and complete version history
      description: Returns model details and all historical pricing versions, newest
        first. A slug with no stored model but a built-in canonical price is answered
        from the built-in table. Requires billing.read or providers.read.
      parameters:
      - name: idOrSlug
        in: path
        required: true
        description: Model ID (UUID) or model slug
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingModelDetail'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Pricing model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/pricing/{idOrSlug}/versions:
    post:
      tags:
      - pricing
      operationId: createPricingVersion
      summary: Append a new versioned price sheet
      description: Appends a new immutable pricing version. effective_from defaults
        to now. Requires billing.manage.
      parameters:
      - name: idOrSlug
        in: path
        required: true
        description: Model ID (UUID) or model slug
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePricingVersionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingVersion'
        '400':
          description: Negative price (negative_price), cached price on a model without
            caching (unsupported_token_category), or effective_to not after effective_from
            (invalid_effective_window).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/pricing/{idOrSlug}/versions/{version}:
    get:
      tags:
      - pricing
      operationId: getPricingVersion
      summary: Get a specific historical pricing version
      description: Requires billing.read or providers.read.
      parameters:
      - name: idOrSlug
        in: path
        required: true
        description: Model ID (UUID) or model slug
        schema:
          type: string
      - name: version
        in: path
        required: true
        description: Positive version number
        schema:
          type: integer
          format: int32
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingVersion'
        '400':
          description: version is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Model or version not found (not_found or pricing_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/pricing/calculate-cost:
    post:
      tags:
      - pricing
      operationId: calculateCost
      summary: Calculate token cost for a model
      description: Computes the micro-unit cost for prompt, completion and cached input
        tokens using the requested version, the version effective at effective_at,
        or the current one. Falls back to the built-in canonical price table for a
        slug with no stored model. Requires billing.read or providers.read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateCostRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateCostResponse'
        '400':
          description: Malformed body, empty model_slug, negative token counts (invalid_token_count),
            or cached tokens on a model without caching (unsupported_token_category).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: No pricing is available for the model (pricing_unavailable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
