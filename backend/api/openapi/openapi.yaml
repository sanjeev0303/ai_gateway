      description: 'Requires usage.read. Fields are PascalCase because the Go struct has no JSON tags. Percentiles are computed in Postgres. Without group_by the list holds exactly one overall row with null Provider and Model. Default window is the last 24 hours.'
      parameters:
      - name: from
        in: query
        required: false
        description: 'RFC3339 start of the window (inclusive). Defaults to 24 hours before now.'
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: 'RFC3339 end of the window (exclusive). Defaults to now. Must not be before from.'
        schema:
          type: string
          format: date-time
      - name: project_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: user_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: service_account_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: team_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: provider
        in: query
        required: false
        description: 'Provider kind, e.g. openai.'
        schema:
          type: string
      - name: model
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - succeeded
          - failed
          - cancelled
      - name: group_by
        in: query
        required: false
        description: 'provider_model splits the percentiles per provider and model; any other value returns one overall row.'
        schema:
          type: string
          enum:
          - provider_model
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageLatencyListResponse'
        '400':
          description: A malformed timestamp, uuid, status or integer, or from after to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant usage.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/usage/recent:
