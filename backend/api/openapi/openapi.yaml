          format: uuid
  /v1/conversations/{id}/messages:
    get:
      operationId: getv1conversationsidmessages
      summary: List the turns of one conversation
      description: Text is never stored; each turn's content is filled from gateway
        memory while the gateway still holds it, and the key is omitted otherwise.
        The privacy mode does not hide text here. Requires the usage.read permission;
        roles other than owner, admin and auditor get 403 for another user's conversation.
      responses:
        '200':
          description: Success
          content:
            application/json:
