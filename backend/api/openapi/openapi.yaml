          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/provider-accounts/{id}/credentials:
    post:
      operationId: postv1provideraccountsidcredentials
      summary: Add a key to a provider account
      description: Requires credentials.manage. The secret is validated live against
        the provider, then stored only in the secret store; it is never returned.
        Only api_key credentials exist, and kind values such as empty, apikey, key
        or a provider kind are normalised to api_key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderCredentialRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredential'
        '400':
          description: The id is not a UUID, the body is malformed, name or secret
            is empty, kind is unsupported or the provider rejected the key (invalid_provider_credential).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant credentials.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such provider account in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The provider account is not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: The provider could not be reached to verify the key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/provider-accounts/{id}/validate:
    post:
      operationId: validateProviderAccount
      summary: Validate a provider account's stored key
      description: Requires providers.manage. Probes the provider with the account's
        first stored credential. A key the provider rejects is reported as valid=false
        with 200, not as an error. Takes no request body.
      responses:
        '200':
          description: The probe ran.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderValidationResult'
        '400':
          description: The id is not a UUID or the provider kind has no client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant providers.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such account, or the account has no credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: The provider could not be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/provider-accounts/{id}/sync:
    post:
      operationId: syncProviderAccountModels
      summary: Sync the model catalog from a provider account
      description: Requires providers.manage. Lists models upstream with the account's
        first non-revoked credential, upserts them into the global catalog and returns
        the synced models. The outcome is also recorded as the provider's health. Takes
        no request body.
      responses:
        '200':
          description: The synced models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogModelListResponse'
        '400':
          description: The id is not a UUID, the account is disabled (account_disabled),
            every credential is revoked (credential_revoked) or the provider rejected
            the key (invalid_provider_credential).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant providers.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such account, or the account has no credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: The provider offers no model discovery or could not be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/provider-accounts/{id}/health:
    post:
      operationId: checkProviderAccountHealth
      summary: Run a health check for a provider account
      description: Requires providers.read. Probes the provider with the account's
        first stored credential and records the result. An upstream failure is returned
        as status unhealthy with 200. Takes no request body.
      responses:
        '200':
          description: The observed health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderHealth'
        '400':
