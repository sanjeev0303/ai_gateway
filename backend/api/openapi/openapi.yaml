  /v1/provider-credentials:
    get:
      operationId: getv1providercredentials
      summary: List provider credentials
      description: Requires credentials.read. Includes revoked credentials.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredentialListResponse'
        '403':
          description: The caller's role does not grant credentials.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/provider-credentials/{id}:
    get:
      operationId: getv1providercredentialsid
      summary: Get one provider credential
      description: Requires credentials.read.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredential'
        '400':
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant credentials.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such credential in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deletev1providercredentialsid
      summary: Revoke a provider credential
      description: Requires credentials.manage. Marks the credential revoked and deletes
        its stored secret; the row stays listed.
      responses:
        '204':
          description: Revoked
        '400':
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant credentials.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such credential in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/provider-credentials/{id}/rotate:
    post:
      operationId: postv1providercredentialsidrotate
      summary: Rotate a provider credential
      description: Requires credentials.manage. Creates a new active credential named
        "<name> (rotated)" with the new secret, then revokes the old one, so traffic
        keeps flowing. Returns the new credential, which has a new id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateProviderCredentialRequest'
      responses:
        '201':
          description: The new credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredential'
        '400':
          description: The id is not a UUID, the body is malformed, the secret is
            empty, the credential is already revoked or the provider rejected the key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant credentials.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such credential in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The provider account is not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/models:
    get:
      operationId: getv1models
      summary: List catalog models
      description: Requires providers.read. Returns catalog models only for providers
        that have an active account with at least one active credential in the caller's
        organization. By default only active models are listed.
      parameters:
      - name: all
        in: query
        required: false
        description: Pass true to include inactive catalog models.
        schema:
          type: string
          enum:
          - 'true'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogModelListResponse'
        '403':
          description: The caller's role does not grant providers.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/models/sync:
    post:
      operationId: postv1modelssync
      summary: Sync the model catalog from providers
      description: 'Requires providers.manage. The body is optional and a malformed
        body is ignored. With provider_kind and api_key the key is used for this probe
        only and never stored. With provider_kind alone the first active account of
        that kind is synced. With neither, every active account is synced and per-account
        failures are skipped silently. Returns the synced models.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncCatalogModelsRequest'
      responses:
        '200':
          description: The synced models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogModelListResponse'
        '400':
          description: Unknown provider_kind, no active account for provider_kind,
            or the provider rejected the key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant providers.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: The provider offers no model discovery or could not be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/provider-credentials/validate:
    post:
      operationId: postv1providercredentialsvalidate
      summary: Validate a provider key without storing it
      description: Requires providers.manage. The api_key is used for the probe only;
        it is never stored, returned or logged. A key the provider rejects is reported
        as valid=false with 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderProbeRequest'
      responses:
        '200':
          description: The probe ran.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderValidationResult'
        '400':
          description: Malformed body, unknown provider_kind or empty api_key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant providers.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: The provider could not be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/provider-health/check:
    post:
      operationId: postv1providerhealthcheck
      summary: Run a provider health check
      description: Requires providers.read. Probes provider_kind with api_key (never
        stored) and records the result as that provider kind's current health. An
        upstream failure is returned as status unhealthy with 200.
