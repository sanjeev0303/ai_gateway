components:
  schemas:
    EmptyResponse:
      type: object
    PaginatedResponse:
      type: object
    ErrorEnvelope:
      type: object
      description: The error body returned by every endpoint.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Stable machine-readable code, e.g. not_found or invalid_argument.
            message:
              type: string
              description: Human-readable summary; safe to surface to an end user.
            request_id:
              type: string
              description: Correlates the response with server logs.
            details:
              description: Optional structured context; shape depends on code.
    ConversationPrivacyMode:
      type: string
      description: How much transcript content may be returned for a conversation.
        A conversation's own privacy_state always wins; otherwise the server applies
        AIGW_CONVERSATION_PRIVACY_DEFAULT and fails closed to METADATA_ONLY when that
        is unset or unrecognized. No query parameter can widen this.
      enum:
      - false
      - METADATA_ONLY
      - PROMPT_ONLY
      - FULL_CONTENT
    ConversationSummary:
      type: object
      description: One conversation plus the aggregates derived from its messages.
        request_count counts assistant turns, not messages, so it can be lower than
        message_count.
      required:
      - id
      - title
      - user_id
      - started_at
      - request_count
      - message_count
      - total_tokens
      - privacy_state
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        user_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
          nullable: true
          description: Null when the conversation has no messages.
        request_count:
          type: integer
          format: int32
        message_count:
          type: integer
          format: int32
        total_tokens:
          type: integer
          format: int32
        cost_micros:
          type: integer
          format: int64
          nullable: true
          description: 'Always null today: conversation_messages carries no link to
            llm_requests, so per-conversation spend cannot be derived. The field is
            present so cost can be filled in without a breaking change.'
        privacy_state:
          $ref: '#/components/schemas/ConversationPrivacyMode'
    ConversationMessage:
      type: object
      description: 'One stored turn. content is deliberately not required: a turn
        whose content the effective privacy mode withholds carries no content key
        at all rather than an empty string, so a client can tell redacted from genuinely
        empty.'
      required:
      - id
      - conversation_id
      - role
      - tokens
      - created_at
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          type: string
          description: system, user, assistant, or tool. PROMPT_ONLY keeps content
            only for system and user turns.
        content:
          type: string
          description: Absent when the effective privacy mode withholds it.
        tokens:
          type: integer
          format: int32
        tool_name:
          type: string
          nullable: true
        provider_message_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    ConversationListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationSummary'
    ConversationMessagesResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
    AuditLog:
      type: object
      description: One immutable audit record. Audit records are written by the server
        and can never be edited or deleted through the API. actor_type reports which
        of the two actor id columns is populated.
      required:
      - id
      - actor_type
      - action
      - resource_type
      - before
      - after
      - created_at
      properties:
        id:
          type: string
          format: uuid
        actor_type:
          type: string
          enum:
          - user
          - service_account
        actor_user_id:
          type: string
          format: uuid
          nullable: true
        actor_service_account_id:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
          description: Dotted action name, e.g. organization.update.
        resource_type:
          type: string
        resource_id:
          type: string
          format: uuid
          nullable: true
        before:
          type: object
          additionalProperties: true
          description: State before the change; an empty object when not recorded.
        after:
          type: object
          additionalProperties: true
          description: State after the change; an empty object when not recorded.
        ip_address:
          type: string
          nullable: true
        request_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    AuditLogListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
    SecurityEvent:
      type: object
      description: One platform-originated security event. Events are written by background
        jobs and health probes, never by a user request, and can never be edited or
        deleted through the API.
      required:
      - id
      - category
      - severity
      - title
      - detail
      - source
      - created_at
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          enum:
          - provider_incident
          - pipeline_failure
        severity:
          type: string
          enum:
          - info
          - warning
          - critical
        title:
          type: string
          description: Short human-readable summary of what changed.
        detail:
          type: object
          additionalProperties: true
          description: Structured context for the event, e.g. the provider kind and
            the from/to status for a provider_incident, or the failing stage for a
            pipeline_failure. An empty object when nothing was recorded.
        source:
          type: string
          description: Originating subsystem, e.g. provider_health or usage_rollup.
        created_at:
          type: string
          format: date-time
    SecurityEventListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SecurityEvent'
    Alert:
      type: object
      description: 'One configured alert rule. Reading a rule exposes only what it
        declares: no evaluator is wired to any rule type, so last_triggered_at stays
        null and nothing here implies the rule fires.'
      required:
      - id
      - alert_type
      - name
      - severity
      - configuration
      - status
      - last_triggered_at
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        alert_type:
          type: string
          enum:
          - spend_limit
          - rate_limit
          - error_rate
          - anomaly
        name:
          type: string
        severity:
          type: string
          enum:
          - info
          - warning
          - critical
        configuration:
          type: object
          additionalProperties: true
          description: Rule thresholds and options; an empty object when unset.
        status:
          type: string
          enum:
          - active
          - muted
        last_triggered_at:
          type: string
          format: date-time
          nullable: true
          description: Always null today, because nothing evaluates alert rules.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AlertListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
    UpdateAlertRequest:
      type: object
      description: Full replacement of an alert rule's mutable fields; all four are
        required. alert_type is not writable.
      required:
      - name
      - severity
      - configuration
      - status
      properties:
        name:
          type: string
          minLength: 1
        severity:
          type: string
          enum:
          - info
          - warning
          - critical
        configuration:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
          - active
          - muted
    AlertTestResult:
      type: object
      description: 'The outcome of validating a rule''s configuration. There is deliberately
        no would-fire field: no evaluator exists to produce one.'
      required:
      - alert_id
      - alert_type
      - severity
      - status
      - configuration
      - status_is_muted
      - notification_sent
      - message
      properties:
        alert_id:
          type: string
          format: uuid
        alert_type:
          type: string
          enum:
          - spend_limit
          - rate_limit
          - error_rate
          - anomaly
        severity:
          type: string
          enum:
          - info
          - warning
          - critical
        status:
          type: string
          enum:
          - active
          - muted
        configuration:
          type: object
          additionalProperties: true
        status_is_muted:
          type: boolean
        notification_sent:
          type: boolean
          description: Always false; no notifier is invoked.
        message:
          type: string
    Organization:
      type: object
      description: An organization. Only persisted columns are exposed. MRR, seat
        counts, billing contact email and region are deliberately absent because no
        such data is stored for an organization.
      required:
      - id
      - name
      - slug
      - status
      - created_at
      - updated_at
      - plan
      - billing
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
          - active
          - suspended
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        plan:
          nullable: true
          description: Null when the organization has no active or trialing subscription.
          allOf:
          - $ref: '#/components/schemas/OrganizationPlan'
        billing:
          nullable: true
          description: Null when the organization has no active or trialing subscription.
          allOf:
          - $ref: '#/components/schemas/OrganizationBilling'
    OrganizationPlan:
      type: object
      description: The plan on the organization's active or trialing subscription.
      required:
      - code
      - name
      properties:
        code:
          type: string
        name:
          type: string
    OrganizationBilling:
      type: object
      description: Billing state of the organization's active or trialing subscription.
        Period timestamps are empty strings when the stored column is NULL.
      required:
      - status
      - current_period_start
      - current_period_end
      - cancel_at_period_end
      properties:
        status:
          type: string
          description: Only active or trialing subscriptions are surfaced; other states
            leave plan and billing null.
          enum:
          - active
          - trialing
        current_period_start:
          type: string
          description: RFC3339 timestamp, or an empty string when NULL.
        current_period_end:
          type: string
          description: RFC3339 timestamp, or an empty string when NULL.
        cancel_at_period_end:
          type: boolean
    UpdateOrganizationRequest:
      type: object
      description: Writable organization fields. Both are optional; a blank name or
        slug is rejected. status is read-only.
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
    Plan:
      type: object
      description: One sellable plan from the global catalog. No price, seat count,
        or billing contact is included because none is stored in this service.
      required:
      - id
      - code
      - name
      - description
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - active
          - inactive
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlanListResponse:
      type: object
      required:
