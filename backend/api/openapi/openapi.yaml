      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/audit-logs:
    get:
      operationId: getv1auditlogs
      summary: List audit records
      description: 'Returns the caller''s organization audit ledger, newest first.
        Audit records are append-only: this API exposes no way to modify or remove
        one. Requires the audit.read permission.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '400':
          description: A filter or pagination value is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant audit.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: actor_id
        in: query
        required: false
        description: Matches a record written by either the user or the service account
          with this id. Combine with actor_type to disambiguate.
        schema:
          type: string
          format: uuid
      - name: actor_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - user
          - service_account
      - name: action
        in: query
        required: false
        description: Exact action name, e.g. organization.update.
        schema:
          type: string
      - name: resource_type
        in: query
        required: false
        schema:
          type: string
      - name: resource_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: false
        description: Only records created at or after this RFC3339 timestamp.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: Only records created before this RFC3339 timestamp.
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        description: Page size, 1 to 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        required: false
        description: Rows to skip; must be zero or greater.
        schema:
          type: integer
          minimum: 0
          default: 0
  /v1/audit-logs/{id}:
    get:
      operationId: getv1auditlogsid
      summary: Get one audit record
      description: Requires the audit.read permission. A record belonging to another
        organization is reported as not found rather than forbidden.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
        '400':
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant audit.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such audit record in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/security-events:
    get:
      operationId: getv1securityevents
      summary: List security events
      description: "Returns the caller's organization security feed, newest first.\
        \ Events are produced by the platform rather than by any user action and are\
        \ append-only: this API exposes no way to modify or remove one. Two categories\
        \ exist \u2014 provider_incident for a provider's observed reachability changing,\
        \ and pipeline_failure for a background job failing \u2014 so the feed covers\
        \ the platform itself, not gateway request activity. Requires the security_events.read\
        \ permission."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityEventListResponse'
        '400':
          description: A filter or pagination value is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant security_events.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - provider_incident
          - pipeline_failure
      - name: severity
        in: query
        required: false
        schema:
          type: string
          enum:
          - info
          - warning
          - critical
      - name: from
        in: query
        required: false
        description: Only events created at or after this RFC3339 timestamp.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: Only events created before this RFC3339 timestamp.
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        description: Page size, 1 to 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        required: false
        description: Rows to skip; must be zero or greater.
        schema:
          type: integer
          minimum: 0
          default: 0
  /v1/alerts:
    get:
      operationId: getvalerts
      summary: List alert rules
      description: Returns the caller's organization alert rules. Listing a rule reports
        only its configuration; no rule is evaluated by this API. Requires the alerts.read
        permission.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertListResponse'
        '403':
          description: The caller's role does not grant alerts.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/alerts/{id}:
    get:
      operationId: getvalertsid
      summary: Get one alert rule
      description: Requires the alerts.read permission. A rule belonging to another
        organization is reported as not found rather than forbidden.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '400':
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant alerts.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such alert rule in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: putvalertsid
      summary: Replace an alert rule
      description: Replaces the mutable fields of an alert rule in full; every field
        is required. alert_type is fixed at creation and cannot be changed. The configuration
        must be a JSON object. Requires the alerts.manage permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlertRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '400':
          description: The id is not a UUID, the body is malformed, the name is blank,
            the severity or status is not a known value, or the configuration is not
            a JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant alerts.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such alert rule in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deletevalertsid
      summary: Delete an alert rule
      description: Deletes the rule. Requires the alerts.manage permission.
      responses:
        '204':
          description: Deleted
        '400':
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant alerts.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such alert rule in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/alerts/{id}/test:
    post:
      operationId: postvalertsidtest
      summary: Validate an alert rule's configuration
      description: 'Returns the rule''s declared configuration and whether it is muted.
        No evaluator is wired to any alert rule type, so this never reports whether
        a rule would fire and never sends a notification: notification_sent is always
        false. Requires the alerts.manage permission.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertTestResult'
        '400':
          description: The id is not a UUID, or the stored configuration is not a
            JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant alerts.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such alert rule in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/billing/plans:
    get:
      operationId: getv1billingplans
      summary: List sellable plans
      description: Returns every plan in the catalog. Plans are global, so this list
        is identical for all organizations. No price is returned because no price
        is stored anywhere in this service. Requires the billing.read permission.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanListResponse'
        '403':
          description: The caller's role does not grant billing.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/billing/subscription:
    get:
      operationId: getv1billingsubscription
      summary: Get the organization's current plan and billing cycle
      description: Returns the organization's stored subscription. An organization
        with no subscription is reported as not found rather than as an empty object.
        Requires the billing.read permission.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '403':
          description: The caller's role does not grant billing.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The organization has no subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/billing/usage:
    get:
      operationId: getv1billingusage
      summary: Get recorded cost and request totals for a window
      description: Returns the same aggregated usage summary as /v1/usage/summary,
        scoped to the caller's organization. All values are measured from recorded
        requests; nothing here is estimated or forecast. Requires the billing.read
        permission.
      parameters:
      - name: from
        in: query
        required: false
        description: Inclusive RFC3339 start. Defaults to 30 days ago.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: Exclusive RFC3339 end. Defaults to now.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingUsageSummary'
        '400':
          description: from or to is not RFC3339, or from is not before to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant billing.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/billing/invoices:
    get:
      operationId: getv1billinginvoices
      summary: List the organization's invoices
      description: 'Returns the organization''s invoices newest issued first, each
        with its itemisation lines. These are locally computed statements only: no
        payment processor is integrated, so no invoice is ever marked paid and no
        field references a charge, payment, or PDF. Requires the billing.read permission.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListResponse'
        '403':
          description: The caller's role does not grant billing.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/pricing:
