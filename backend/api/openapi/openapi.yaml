          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant usage.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: team_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: project_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: credential_id
        in: query
        required: false
        description: A gateway key id (UUID), or the literal none for conversations
          that recorded no key.
        schema:
          type: string
      - name: provider
        in: query
        required: false
        schema:
          type: string
      - name: model
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: Only conversations started at or after this RFC3339 timestamp.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: Only conversations started at or before this RFC3339 timestamp.
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        description: Page size, 1 to 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        required: false
        description: Rows to skip; must be zero or greater.
        schema:
          type: integer
          minimum: 0
          default: 0
    post:
      operationId: createConversation
      summary: Create a conversation for the caller
      description: A blank or omitted title becomes "New Conversation". Requires the
        usage.read permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedConversation'
        '400':
          description: The body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant usage.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/conversations/by-key:
