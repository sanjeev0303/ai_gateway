          format: int64
        OutputTokens:
          type: integer
          format: int64
        CachedTokens:
          type: integer
          format: int64
        ReasoningTokens:
          type: integer
          format: int64
        ToolTokens:
          type: integer
          format: int64
        TotalTokens:
          type: integer
          format: int64
        TotalCostMicros:
          type: integer
          format: int64
          description: Recorded cost in millionths of the currency's major unit.
        Errors:
