openapi: 3.0.3
info:
  title: AI Governance API
  description: Contract for the AI Governance control plane and data plane APIs.
  version: 0.1.0
servers:
- url: http://localhost:8080
paths:
  /livez:
    get:
      operationId: getLivez
      responses:
        '200':
          description: ok
  /readyz:
    get:
      operationId: getReadyz
      responses:
        '200':
          description: ok
  /healthz:
    get:
      operationId: getHealthz
      responses:
        '200':
          description: ok
  /v1/activity:
    get:
      operationId: getv1activity
      summary: List live gateway activity
      description: Returns the in-flight requests tracked in Redis for the caller's
        organization. When none are in flight it falls back to the 50 most recent
        completed requests (current_state completed or failed). Any authenticated
        member may call it; no permission is checked. Unlike most lists the payload
        is wrapped in data, not items.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityEventListResponse'
  /v1/activity/active-users:
    get:
      operationId: getv1activityactiveusers
      summary: Count users with in-flight requests
      description: Counts distinct user_id values among in-flight requests. Requests
        made by service accounts are not counted. No permission is checked.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityCount'
  /v1/activity/active-requests:
    get:
      operationId: getv1activityactiverequests
      summary: Count in-flight requests
      description: No permission is checked.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityCount'
  /v1/activity/stream:
    get:
      operationId: getv1activitystream
      summary: Stream live gateway activity
      description: 'Server-sent events. The stream opens with one `event: ping` frame
        whose data is `{}`. Every later frame is an unnamed `data:` frame carrying one
        ActivityEvent as JSON. Events are dropped, not queued, for a slow reader.
        Without Redis the stream closes right after the ping. No permission is checked.'
      responses:
        '200':
          description: An open text/event-stream; each data line is an ActivityEvent.
          content:
            text/event-stream:
              schema:
                type: string
                description: 'SSE frames: `event: ping\ndata: {}\n\n`, then `data: <ActivityEvent
                  JSON>\n\n` per event.'
  /v1/auth/signup:
    post:
      operationId: postv1authsignup
      summary: Create an account and its organization
      description: Registered only when the deployment uses session cookies. The
        access, refresh and CSRF cookies are set on the response; no token appears
        in the body. Not behind requireAuth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Created; session cookies are set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: The body is malformed or a field is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: An account with this email already exists (code email_taken).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/auth/signin:
    post:
      operationId: postv1authsignin
      summary: Sign in with email and password
      description: Registered only when the deployment uses session cookies. Rate
        limited to 10 attempts a minute per client IP plus email. Session cookies
        are set on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Signed in; session cookies are set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: The body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Wrong email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Too many attempts; a Retry-After header gives the wait in seconds.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/auth/refresh:
    post:
      operationId: postv1authrefresh
      summary: Rotate the refresh cookie
      description: Authenticates on the refresh cookie alone and requires the
        X-CSRF-Token header to match the CSRF cookie. Issues fresh access, refresh
        and CSRF cookies. On a rejected refresh token every session cookie is cleared.
      responses:
        '200':
          description: Rotated; new session cookies are set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: The refresh cookie is missing (code missing_refresh_token) or
            invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Missing or mismatched CSRF token (code csrf_token_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/auth/logout:
    post:
      operationId: postv1authlogout
      summary: Sign out
      description: Retires the refresh token server-side, if the cookie is present,
        and clears every session cookie. Requires the CSRF header; no access token
        is needed.
      responses:
        '204':
          description: Signed out
        '403':
          description: Missing or mismatched CSRF token (code csrf_token_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/auth/session:
    get:
      operationId: getv1authsession
      summary: Get the caller's session
      description: Reports the verified claims and the CSRF token. Never re-issues
        the access or refresh cookie; only the CSRF cookie is set, and only when it
        is missing. API-key callers have no claims and get 401.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/auth/dev-login:
    post:
      operationId: postv1authdevlogin
      summary: Passwordless local-development sign-in
      description: Registered only when the dev-login flag is on. Creates the user
        on first use. Sets session cookies when the deployment uses them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: The body is malformed or a field is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/auth/switch-org:
    post:
      operationId: postv1authswitchorg
      summary: Switch the session to another organization
      description: Re-issues the session cookies scoped to an organization the caller
        is a member of. Only user actors may switch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchOrganizationRequest'
      responses:
        '200':
          description: Switched; new session cookies are set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: The body is malformed or organization_id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: The caller is not a user, or not a member of that organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The target organization is suspended (code organization_suspended).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/organizations/me:
    get:
      operationId: getv1organizationsme
      summary: Get the caller's organization
      description: Alias of GET /v1/organization. Carries the caller's plan and billing
        state only when an active or trialing subscription row exists; both are null
        otherwise. No derived metrics are synthesized.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          description: The caller's role does not grant org.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/organization:
    get:
      operationId: getv1organization
      summary: Get the caller's organization
      description: Returns the caller's organization. plan and billing are populated
        only when the organization has an active or trialing subscription.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          description: The caller's role does not grant org.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: patchv1organization
      summary: Update the caller's organization
      description: Partial update; omitted fields are left unchanged. plan and billing
        come back null because this write path does not re-read the subscription.
        Requires org.update (owner only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: The body is malformed, name or slug is blank, or privacy_default
            is not a known mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant org.update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The slug is taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/members:
    get:
      operationId: getv1members
      summary: List organization members
      description: Requires members.read. Not paginated.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMemberListResponse'
        '403':
          description: The caller's role does not grant members.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/members/{userID}/role:
    patch:
      operationId: patchv1membersuserIDrole
      summary: Change a member's role
      description: Requires members.manage. A caller cannot change their own role,
        granting owner or admin requires the caller to be an owner, and the last
        owner cannot be demoted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMemberRoleRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMember'
        '400':
          description: The userID is not a UUID, the body is malformed, or the role
            is not an organization role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Not permitted by the rules above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such member in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: userID
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/members/{userID}:
    delete:
      operationId: deletev1membersuserID
      summary: Remove a member from the organization
      description: Requires members.manage.
      responses:
        '204':
          description: Removed
        '400':
          description: The userID is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller may not remove this member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such member in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: userID
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/invitations:
    post:
      operationId: postv1invitations
      summary: Invite someone to the organization
      description: Requires members.manage; inviting as owner or admin requires the
        caller to be an owner. The raw token is returned only here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvitationResponse'
        '400':
          description: The body is malformed, the email is blank, or the role is not
            an organization role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller may not grant this role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: getv1invitations
      summary: List invitations
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResponse'
        '403':
          description: The caller's role does not grant members.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/invitations/accept:
    post:
      operationId: postv1invitationsaccept
      summary: Accept an invitation
      description: Adds the calling user to the inviting organization. When session
        cookies are in use, the session is also switched to that organization and
        fresh cookies are set (the CSRF token is then only in the cookie).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMember'
        '400':
          description: The invitation is invalid (invalid_invitation), expired
            (invitation_expired), or addressed to another email (invitation_email_mismatch).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller is not a user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/invitations/{id}:
    delete:
      operationId: deletev1invitationsid
      summary: Revoke an invitation
      responses:
        '204':
          description: Revoked
        '400':
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant members.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such invitation in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/projects:
    post:
      operationId: postv1projects
      summary: Create a project
      description: Requires projects.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: The body is malformed or a field is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant projects.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The slug is taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: getv1projects
      summary: List projects
      description: Requires projects.read. Not paginated.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '403':
          description: The caller's role does not grant projects.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/projects/{id}:
    get:
      operationId: getv1projectsid
      summary: Get a project
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such project in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: patchv1projectsid
      summary: Update a project
      description: Partial update of name and description. Requires projects.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: The id is not a UUID, the body is malformed, or the name is blank.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant projects.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such project in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/projects/{id}/members:
    post:
      operationId: postv1projectsidmembers
      summary: Add a user to a project
      description: Requires projects.manage. Returns the flat membership row, not
        the user-nested shape the list returns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMembershipRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberRow'
        '400':
          description: The id or user_id is not a UUID, the body is malformed, or the
            role is not admin or member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant projects.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such project or user in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The user is already a member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getv1projectsidmembers
      summary: List a project's members
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipListResponse'
        '400':
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant projects.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/projects/{id}/members/{userID}:
    delete:
      operationId: deletev1projectsidmembersuserID
      summary: Remove a user from a project
      responses:
        '204':
          description: Removed
        '400':
          description: The id or userID is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant projects.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userID
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/projects/{id}/status:
    patch:
      operationId: patchv1projectsidstatus
      summary: Archive or unarchive a project
      description: Requires projects.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProjectStatusRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: The id is not a UUID, the body is malformed, or the status is
            not active or archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant projects.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such project in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/teams:
    post:
      operationId: postv1teams
      summary: Create a team
      description: Requires teams.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: The body is malformed or the name is blank.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant teams.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: A team with this name exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: getv1teams
      summary: List teams
      description: Requires teams.read. Not paginated.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamListResponse'
        '403':
          description: The caller's role does not grant teams.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/teams/{id}:
    get:
      operationId: getv1teamsid
      summary: Get a team
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: The id is not a UUID.
