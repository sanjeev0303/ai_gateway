  /v1/conversations:
    get:
      operationId: getv1conversations
      summary: List conversations
      description: Returns conversations in the caller's organization with the aggregates
        derived from their messages. No query parameter influences how much transcript
        content is returned.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '400':
          description: A filter or pagination value is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: team_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: project_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: provider
        in: query
        required: false
        schema:
          type: string
      - name: model
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: Only conversations started at or after this RFC3339 timestamp.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: Only conversations started at or before this RFC3339 timestamp.
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        description: Page size, 1 to 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        required: false
        description: Rows to skip; must be zero or greater.
        schema:
          type: integer
          minimum: 0
          default: 0
  /v1/conversations/{id}:
    get:
      operationId: getv1conversationsid
      summary: Get one conversation
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSummary'
        '400':
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such conversation in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/conversations/{id}/messages:
    get:
      operationId: getv1conversationsidmessages
      summary: List the turns of one conversation
      description: content is omitted from a turn whose content the effective privacy
        mode withholds, so a redacted turn carries no content key at all.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessagesResponse'
        '400':
          description: The id is not a UUID.
          content:
            application/json:
              schema:
