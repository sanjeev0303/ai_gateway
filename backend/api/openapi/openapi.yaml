  /v1/search:
    get:
      operationId: getv1search
      summary: Search across the organization
      description: Case-insensitive substring match over the entity types the caller
        can read. Types the caller cannot read are skipped silently rather than
        failing the request. An empty q returns no results.
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: types
        in: query
        required: false
        description: Repeat the parameter to search several types. Unknown values
          are ignored; none given (or none valid) searches every type.
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultType'
      - name: limit
        in: query
        required: false
        description: 1 to 100; any other value falls back to 20.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
