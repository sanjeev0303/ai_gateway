  /v1/budgets:
    get:
      tags:
      - budgets
      operationId: listBudgets
      summary: List budgets with current usage
      description: Open to every authenticated member. Usage figures are recomputed
        for the current window of each budget. An unparseable scope_id is ignored
        rather than rejected; enabled matches only the literal "true".
      parameters:
      - name: scope
        in: query
        required: false
        schema:
          type: string
          enum: [organization, team, project, gateway_credential, service_account]
      - name: scope_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: limit_type
        in: query
        required: false
        schema:
          type: string
          enum: [spend, tokens, requests]
      - name: enabled
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetList'
    post:
      tags:
      - budgets
      operationId: createBudget
      summary: Create a budget
      description: Owner role only. Also writes the matching policy budget rule the
        gateway enforces. Invalid values (empty name, limit_amount <= 0, alert_threshold
        outside 0..1) currently surface as a 500 internal error, not a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          description: Malformed body, or scope_id is not a UUID (code internal).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller is not the owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
