              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/conversations/{id}:
    get:
      operationId: getv1conversationsid
      summary: Get one conversation
      description: Requires the usage.read permission. Roles other than owner, admin
        and auditor get 403 for another user's conversation.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSummary'
        '400':
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller lacks usage.read, or the conversation belongs to
            another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such conversation in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deletev1conversationsid
      summary: Delete one conversation, its text included (owners and admins)
      responses:
        '204':
          description: Deleted.
        '400':
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Only owners and admins may delete conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such conversation in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
