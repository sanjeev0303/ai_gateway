  /v1/alerts:
    get:
      operationId: getvalerts
      summary: List alert rules
      description: Returns the caller's organization alert rules, oldest first. Requires
        the alerts.read permission.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertListResponse'
        '403':
          description: The caller's role does not grant alerts.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createAlert
      summary: Create an alert rule
      description: Creates an active rule. The aliases spend_exceeded and spend_threshold
        are stored as spend_limit, request_rate_spike as rate_limit, error_rate_spike
        as error_rate and usage_anomaly as anomaly. severity defaults to warning. status
        is accepted but ignored; a new rule is always active. Requires the alerts.manage
        permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '400':
          description: The body is malformed, the name or alert_type is blank, the
            severity is not a known value, or the configuration is not a JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant alerts.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/alerts/{id}:
    get:
      operationId: getvalertsid
      summary: Get one alert rule
      description: Requires the alerts.read permission. A rule belonging to another
        organization is reported as not found rather than forbidden.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '400':
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant alerts.read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such alert rule in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: putvalertsid
      summary: Replace an alert rule
      description: Replaces the mutable fields of an alert rule. alert_type is fixed
        at creation and cannot be changed. An omitted configuration is stored as an
        empty object. Requires the alerts.manage permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlertRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '400':
          description: The id is not a UUID, the body is malformed, the name is blank,
            the severity or status is not a known value, or the configuration is not
            a JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant alerts.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such alert rule in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deletevalertsid
      summary: Delete an alert rule
      description: Deletes the rule. Requires the alerts.manage permission.
      responses:
        '204':
          description: Deleted
        '400':
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller's role does not grant alerts.manage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No such alert rule in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
