  /v1/guardrails:
    get:
      tags:
      - guardrails
      operationId: listGuardrails
      summary: List guardrails
      description: Requires guardrails.read or the owner, admin or auditor role.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailList'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags:
      - guardrails
      operationId: createGuardrail
      summary: Create a guardrail
      description: Requires guardrails.manage or the owner or admin role. An empty
        target_id is stored as null. The response echoes the stored fields; its
        created_at and updated_at are not read back from the database and come back
        as the zero time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGuardrailRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guardrail'
        '400':
          description: Malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/guardrails/events:
    get:
      tags:
      - guardrails
      operationId: listGuardrailEvents
      summary: List guardrail trigger events
      description: Requires guardrails.read or the owner, admin or auditor role.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailEventList'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/guardrails/{id}:
    get:
      tags:
      - guardrails
      operationId: getGuardrail
      summary: Get a guardrail
      description: Requires guardrails.read or the owner, admin or auditor role.
      parameters:
      - name: id
        in: path
        required: true
        description: Guardrail ID (a UUID; not validated before lookup).
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guardrail'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags:
      - guardrails
      operationId: updateGuardrail
      summary: Update a guardrail
      description: Despite the PATCH verb this overwrites name, description, action,
        configuration and enabled with the values sent; an omitted field is stored
        as its zero value. target_type, target_id and detector cannot be changed.
        Requires guardrails.manage or the owner or admin role.
      parameters:
      - name: id
        in: path
        required: true
        description: Guardrail ID (a UUID; not validated before lookup).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGuardrailRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guardrail'
        '400':
          description: Malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags:
      - guardrails
      operationId: deleteGuardrail
      summary: Delete a guardrail
      description: Requires guardrails.manage or the owner or admin role.
      parameters:
      - name: id
        in: path
        required: true
        description: Guardrail ID (a UUID; not validated before lookup).
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/guardrails/{id}/test:
    post:
      tags:
      - guardrails
      operationId: testGuardrail
      summary: Dry-run a guardrail against a payload
      description: Evaluates only this guardrail against the payload; nothing is
        recorded. Requires guardrails.read or the owner, admin or auditor role.
      parameters:
      - name: id
        in: path
        required: true
        description: Guardrail ID (a UUID; not validated before lookup).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestGuardrailRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestGuardrailResponse'
        '400':
          description: Malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '501':
          description: No guardrail evaluator is wired into this server. Empty body.
components:
  schemas:
    EmptyResponse:
      type: object
    PaginatedResponse:
      type: object
    ErrorEnvelope:
      type: object
      description: The error body returned by every endpoint.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Stable machine-readable code, e.g. not_found or invalid_argument.
            message:
              type: string
              description: Human-readable summary; safe to surface to an end user.
            request_id:
              type: string
              description: Correlates the response with server logs.
            details:
              description: Optional structured context; shape depends on code.
    ConversationPrivacyMode:
      type: string
      description: The conversation's effective privacy mode. A conversation's own
        override wins; otherwise the organization's privacy default applies, and the
        server fails closed to METADATA_ONLY when either is unrecognized.
      enum:
      - 'OFF'
      - METADATA_ONLY
      - PROMPT_ONLY
      - FULL_CONTENT
    ConversationSummary:
      type: object
      description: One conversation plus the aggregates derived from its messages.
        request_count counts assistant turns, not messages, so it can be lower than
        message_count.
      required:
      - id
      - title
      - user_id
      - project_id
      - provider
      - model
      - credential_id
      - started_at
      - last_activity_at
      - request_count
      - message_count
      - total_tokens
      - cost_micros
      - privacy_state
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: The opening prompt while the gateway still holds it, otherwise
            the stored title.
        user_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        credential_id:
          type: string
          format: uuid
          nullable: true
          description: The gateway key the conversation came through; null when none
            was recorded.
        started_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
          nullable: true
          description: Null when the conversation has no messages.
        request_count:
          type: integer
          format: int32
        message_count:
          type: integer
          format: int32
        total_tokens:
          type: integer
          format: int32
        cost_micros:
          type: integer
          format: int64
          nullable: true
          description: 'Always null today: conversation_messages carries no link to
            llm_requests, so per-conversation spend cannot be derived. The field is
            present so cost can be filled in without a breaking change.'
        privacy_state:
          $ref: '#/components/schemas/ConversationPrivacyMode'
    ConversationMessage:
      type: object
      description: 'One stored turn. content is not required: text is never stored,
        so the key is present only while the gateway still holds the turn''s text
        in memory.'
      required:
      - id
      - conversation_id
      - role
      - tokens
      - tool_name
      - provider_message_id
      - created_at
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          type: string
          description: system, user, assistant, or tool.
        content:
          type: string
          description: Absent when the gateway no longer holds the text.
        tokens:
          type: integer
          format: int32
        tool_name:
          type: string
          nullable: true
        provider_message_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    ConversationListResponse:
      type: object
      required:
      - items
      - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationSummary'
        has_more:
          type: boolean
          description: True when another page exists past offset + limit.
    ConversationMessagesResponse:
      type: object
      required:
      - items
      - transcript
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
        transcript:
          type: string
          enum:
          - available
          - expired
          description: available when at least one turn carries text; expired when
            the gateway no longer holds any of it (or the conversation has no turns).
    AuditLog:
      type: object
      description: One immutable audit record. Audit records are written by the server
        and can never be edited or deleted through the API. actor_type reports which
        of the two actor id columns is populated.
      required:
      - id
      - actor_type
      - actor_user_id
      - actor_service_account_id
      - action
      - resource_type
      - resource_id
      - before
      - after
      - ip_address
      - request_id
      - created_at
      properties:
        id:
          type: string
          format: uuid
        actor_type:
          type: string
          enum:
          - user
          - service_account
          - ''
          description: Empty when neither actor id is set, e.g. a record written by
            a background worker or one whose actor was since deleted.
        actor_user_id:
          type: string
          format: uuid
          nullable: true
        actor_service_account_id:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
          description: Dotted action name, e.g. organization.update.
        resource_type:
          type: string
        resource_id:
          type: string
          format: uuid
          nullable: true
        before:
          type: object
          additionalProperties: true
          description: State before the change; an empty object when not recorded.
        after:
          type: object
          additionalProperties: true
          description: State after the change; an empty object when not recorded.
        ip_address:
          type: string
          nullable: true
        request_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    AuditLogListResponse:
      type: object
      required:
      - items
      - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        has_more:
          type: boolean
          description: True when another page exists past offset + limit.
    SecurityEvent:
      type: object
      description: One platform-originated security event. Events are written by background
        jobs, health probes and the gateway's policy enforcement, never by a user
        request through this API, and can never be edited or deleted through the API.
      required:
      - id
      - category
      - severity
      - title
      - detail
      - source
      - created_at
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          enum:
          - provider_incident
          - pipeline_failure
          - policy_violation
        severity:
          type: string
          enum:
          - info
          - warning
          - critical
        title:
          type: string
          description: Short human-readable summary of what changed.
        detail:
          type: object
          additionalProperties: true
          description: Structured context for the event, e.g. the provider kind and
            the from/to status for a provider_incident, or the failing stage for a
            pipeline_failure. An empty object when nothing was recorded.
        source:
          type: string
          description: Originating subsystem, e.g. provider_health or usage_rollup.
        created_at:
          type: string
          format: date-time
    SecurityEventListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SecurityEvent'
    Alert:
      type: object
      description: One configured alert rule. A background evaluator checks active
        rules; last_triggered_at is set when it records an event.
      required:
      - id
      - alert_type
      - name
      - severity
      - configuration
      - status
      - last_triggered_at
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        alert_type:
          $ref: '#/components/schemas/AlertRuleType'
        name:
          type: string
        severity:
          type: string
          enum:
          - info
          - warning
          - critical
        configuration:
          type: object
          additionalProperties: true
          description: Rule thresholds and options; an empty object when unset.
        status:
          type: string
          enum:
          - active
          - muted
          - resolved
        last_triggered_at:
          type: string
          format: date-time
          nullable: true
          description: Null until the evaluator first records an event for the rule.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AlertListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
    UpdateAlertRequest:
      type: object
      description: Replacement of an alert rule's mutable fields. alert_type is not
        writable.
      additionalProperties: false
      required:
      - name
      - severity
      - status
      properties:
        name:
          type: string
          minLength: 1
        severity:
          type: string
          enum:
          - info
          - warning
          - critical
        configuration:
          type: object
          additionalProperties: true
          description: Must be a JSON object; omitted means an empty object.
        status:
          type: string
          enum:
          - active
          - muted
          - resolved
    AlertTestResult:
      type: object
      description: The outcome of evaluating a rule once. Nothing is recorded or
        delivered by the test.
      required:
      - alert_id
      - alert_type
      - severity
      - status
      - configuration
      - status_is_muted
      - notification_sent
      - message
      properties:
        alert_id:
          type: string
          format: uuid
        alert_type:
          $ref: '#/components/schemas/AlertRuleType'
        severity:
          type: string
          enum:
          - info
          - warning
          - critical
        status:
          type: string
          enum:
          - active
          - muted
          - resolved
        configuration:
          type: object
          additionalProperties: true
        status_is_muted:
          type: boolean
        notification_sent:
          type: boolean
          description: True when the condition is currently met and the rule is not
            muted. Despite the name, the test itself sends nothing.
        message:
          type: string
          description: The evaluator's human-readable verdict.
    Organization:
      type: object
      description: An organization. Only persisted columns are exposed. MRR, seat
        counts, billing contact email and region are deliberately absent because no
        such data is stored for an organization.
      required:
      - id
      - name
      - slug
      - status
      - created_at
      - updated_at
      - privacy_default
      - retention_conversations_days
      - retention_usage_days
      - retention_audits_days
      - retention_billing_days
      - plan
      - billing
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
          - active
          - suspended
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        privacy_default:
          type: string
          description: Organization-wide default for how much conversation content
            is stored.
          enum:
          - 'OFF'
          - METADATA_ONLY
          - PROMPT_ONLY
          - FULL_CONTENT
        retention_conversations_days:
          type: integer
        retention_usage_days:
          type: integer
        retention_audits_days:
          type: integer
        retention_billing_days:
          type: integer
        plan:
          nullable: true
          description: Null when the organization has no active or trialing subscription,
            and always null in the PATCH response.
          allOf:
          - $ref: '#/components/schemas/OrganizationPlan'
        billing:
          nullable: true
          description: Null when the organization has no active or trialing subscription,
            and always null in the PATCH response.
          allOf:
          - $ref: '#/components/schemas/OrganizationBilling'
    OrganizationPlan:
      type: object
      description: The plan on the organization's active or trialing subscription.
      required:
      - code
      - name
      properties:
        code:
          type: string
        name:
          type: string
    OrganizationBilling:
      type: object
      description: Billing state of the organization's active or trialing subscription.
        Period timestamps are empty strings when the stored column is NULL.
      required:
      - status
      - current_period_start
      - current_period_end
      - cancel_at_period_end
      properties:
        status:
          type: string
          description: Only active or trialing subscriptions are surfaced; other states
            leave plan and billing null.
          enum:
          - active
          - trialing
        current_period_start:
          type: string
          description: RFC3339 timestamp, or an empty string when NULL.
        current_period_end:
          type: string
          description: RFC3339 timestamp, or an empty string when NULL.
        cancel_at_period_end:
          type: boolean
    UpdateOrganizationRequest:
      type: object
      description: Writable organization fields, all optional; omitted fields are
        unchanged. A blank name or slug is rejected and slug is lower-cased. status
        is read-only. Unknown fields are rejected.
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        privacy_default:
          type: string
          enum:
          - 'OFF'
          - METADATA_ONLY
          - PROMPT_ONLY
          - FULL_CONTENT
        retention_conversations_days:
          type: integer
          format: int32
        retention_usage_days:
          type: integer
          format: int32
        retention_audits_days:
          type: integer
          format: int32
        retention_billing_days:
          type: integer
          format: int32
    Plan:
      type: object
      description: One plan from the global catalog. Prices are kept server-side and
        are not part of this body.
      required:
      - id
      - code
      - name
      - description
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - active
          - inactive
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlanListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
    Subscription:
      type: object
      description: The organization's current plan and billing cycle, plus the server's
        billing mode.
      required:
      - plan_code
      - plan_name
      - status
      - current_period_start
      - current_period_end
      - cancel_at_period_end
      - billing_enabled
      properties:
        plan_code:
          type: string
        plan_name:
          type: string
        status:
          type: string
          enum:
          - active
          - trialing
          - canceled
          - past_due
          - incomplete
        current_period_start:
          type: string
          format: date-time
          nullable: true
        current_period_end:
          type: string
          format: date-time
          nullable: true
        cancel_at_period_end:
          type: boolean
        payment_provider:
          type: string
          description: Absent when no payment provider is linked.
        provider_customer_id:
          type: string
          description: Absent when no provider customer is linked.
        provider_subscription_id:
          type: string
          description: Absent when no provider subscription is linked.
        billing_mode:
          type: string
          description: The server's billing mode. Always set by the subscription endpoints.
          enum:
          - disabled
          - simulation
          - test
          - live
        billing_enabled:
          type: boolean
          description: False only when billing_mode is disabled.
    InvoiceLine:
      type: object
      description: One itemisation row behind an invoice total.
      required:
      - id
      - description
      - quantity
      - unit_micros
      - amount_micros
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        quantity:
          type: integer
          format: int64
        unit_micros:
          type: integer
          format: int64
          description: Price per unit in millionths of the currency's major unit.
        amount_micros:
          type: integer
          format: int64
    Invoice:
      type: object
      description: One invoice statement with its itemisation lines.
      required:
      - id
      - subscription_id
      - number
      - status
      - currency
      - total_micros
      - period_start
      - period_end
      - issued_at
      - lines
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
          nullable: true
        number:
          type: string
          description: Human-readable invoice reference.
        status:
          type: string
          enum:
          - open
          - void
          - paid
          - draft
          - uncollectible
        currency:
          type: string
        total_micros:
          type: integer
          format: int64
          description: Invoice total in millionths of the currency's major unit.
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        issued_at:
          type: string
          format: date-time
        payment_provider:
          type: string
          description: Absent unless the invoice was settled through a provider.
        payment_id:
          type: string
          description: Provider payment reference; absent when unpaid.
        paid_at:
          type: string
          format: date-time
          description: Absent when unpaid.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLine'
    InvoiceListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
    BillingUsageSummary:
      type: object
