    BillingUsageSummary:
      type: object
      description: Recorded usage totals for a window, identical to the body of /v1/usage/summary.
        Field names are the Go field names the handler serializes today; averages
        and last activity stay null or zero when the window held no requests, so no
        fabricated measurement is reported.
      required:
      - Requests
      - InputTokens
      - OutputTokens
      - CachedTokens
      - TotalTokens
      - TotalCostMicros
      - Errors
      - AvgLatencyMs
