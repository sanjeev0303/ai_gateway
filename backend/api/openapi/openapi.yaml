          type: integer
          format: int64
        OutputTokens:
          type: integer
          format: int64
        CachedTokens:
          type: integer
          format: int64
        TotalTokens:
          type: integer
          format: int64
        TotalCostMicros:
          type: integer
          format: int64
          description: Recorded cost in millionths of the currency's major unit.
        Errors:
          type: integer
          format: int64
        AvgLatencyMs:
          type: number
          format: double
          nullable: true
          description: Null when the window held no requests.
        LastActivityAt:
          type: string
          format: date-time
          description: Zero time when the window held no requests.
