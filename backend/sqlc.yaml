version: "2"
sql:
  - engine: "postgresql"
    # goose migrations are the single source of truth for the schema; sqlc
    # parses only the "-- +goose Up" sections.
    schema: "internal/infrastructure/postgres/migrations"
    queries: "internal/infrastructure/postgres/queries"
    gen:
      go:
        package: "db"
        out: "internal/infrastructure/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true